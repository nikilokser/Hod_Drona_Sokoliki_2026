<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Ход дрона — доска</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="layout">
    <header class="topbar">
      <div class="topbar-top">
        <div class="brand">
          <span class="brand-logo" aria-hidden="true">🦅</span>
          <span class="brand-name">Соколики</span>
        </div>

        <div class="topbar-status">
          <span class="status-pill" id="connection-status">подключение…</span>
          <span class="status-pill" id="gateway-status">Gateway: …</span>
          <button id="theme-toggle-button" class="icon-button" type="button" aria-label="Переключить тему">🌙</button>
        </div>
      </div>

      <div class="topbar-controls">
        <label class="chip-select">
          <span class="chip-select-label">Режим</span>
          <select id="mode-select">
            <option value="view">Наблюдение</option>
            <option value="correct">Коррекция позиций</option>
            <option value="manual">Ручные ходы (отладка)</option>
          </select>
        </label>
        <label class="chip-select">
          <span class="chip-select-label">Наш цвет</span>
          <select id="color-select">
            <option value="white">Белые</option>
            <option value="black">Чёрные</option>
          </select>
        </label>
        <label class="chip-select">
          <span class="chip-select-label">Фигуры</span>
          <select id="piece-set-select">
            <option value="cburnett">Cburnett (классика)</option>
            <option value="merida">Merida</option>
            <option value="staunty">Staunty</option>
            <option value="alpha">Alpha</option>
          </select>
        </label>
      </div>
    </header>

    <div id="robot-alerts" class="robot-alerts"></div>

    <div class="clock-panel">
      <div class="clock-turn" id="clock-turn">Матч не начат</div>
      <div class="last-move-banner" id="last-move-banner" hidden></div>
      <div class="clock-readout">
        <div class="clock-block">
          <span class="clock-label">Ход</span>
          <span class="clock-value" id="clock-move">5:00</span>
        </div>
        <div class="clock-block">
          <span class="clock-label">Матч</span>
          <span class="clock-value" id="clock-match">2:00:00</span>
        </div>
      </div>
      <div class="clock-actions">
        <button id="match-start-button" type="button">Старт матча</button>
        <button id="turn-done-button" type="button" disabled>Ход сделан</button>
        <button id="match-pause-button" type="button" disabled>Пауза</button>
        <button id="match-end-button" class="danger-button" type="button" disabled>Завершить матч</button>
      </div>
    </div>

    <div class="main-row">
      <aside class="captured-sidebar">
        <div class="captured-sidebar-group">
          <span class="captured-sidebar-label">Взято у соперника</span>
          <div class="captured-sidebar-icons" id="captured-theirs"></div>
        </div>
        <div class="captured-sidebar-group">
          <span class="captured-sidebar-label">Потеряно</span>
          <div class="captured-sidebar-icons" id="captured-ours"></div>
        </div>
      </aside>

      <div class="board-eval-wrap">
        <div class="eval-bar" id="eval-bar" hidden>
          <div class="eval-bar-white" id="eval-bar-white"></div>
          <div class="eval-bar-mid"></div>
          <span class="eval-bar-label" id="eval-bar-label"></span>
        </div>
        <main class="board-area">
          <svg id="board" viewBox="0 0 424 424" width="678" height="678"></svg>
        </main>
      </div>

      <section class="chat-panel">
        <div class="chat-panel-header">
          <h3>Лента переговоров</h3>
          <div class="chat-panel-actions">
            <label class="toggle-label chat-filter-toggle">
              <input type="checkbox" id="chat-show-system-toggle" />
              + системные события
            </label>
            <button id="chat-clear-button" class="danger-button" type="button">Очистить</button>
          </div>
        </div>
        <div id="chat-feed" class="chat-feed"></div>
        <form id="chat-send-form" class="chat-send-form">
          <input
            id="chat-send-input"
            type="text"
            placeholder="@rover_01 статус"
            autocomplete="off"
          />
          <button type="submit">Отправить</button>
        </form>
      </section>
    </div>

    <div class="tabs-panel">
      <div class="tabs-nav" role="tablist">
        <button class="tab-button active" type="button" data-tab="orchestrator">Ход ИИ</button>
        <button class="tab-button" type="button" data-tab="bindings">Привязка роботов</button>
        <button class="tab-button" type="button" data-tab="analysis">Анализ</button>
      </div>

      <div class="tab-panel" data-tab-panel="orchestrator">
        <div class="orchestrator-controls">
          <button id="propose-move-button" type="button">Предложить ход ИИ</button>
          <label class="toggle-label">
            <input type="checkbox" id="auto-move-toggle" />
            Автоход
          </label>
          <span class="toolbar-label" id="orchestrator-status"></span>
        </div>
        <div id="orchestrator-log" class="orchestrator-log"></div>
      </div>

      <div class="tab-panel" data-tab-panel="bindings" hidden>
        <div id="unbound-online-warning" class="unbound-online-warning" hidden></div>
        <div id="bindings-list" class="bindings-list"></div>
        <button id="reset-button" class="danger-button" type="button">Сбросить поле</button>

        <div class="analysis-panel-row clock-settings-row">
          <div class="toolbar-group">
            <span class="toolbar-label">Лимит хода, мин</span>
            <input id="move-limit-input" type="number" min="1" step="1" />
          </div>
          <div class="toolbar-group">
            <span class="toolbar-label">Лимит матча, мин</span>
            <input id="match-limit-input" type="number" min="1" step="1" />
          </div>
          <button id="clock-settings-apply" type="button">Применить лимиты</button>
        </div>
      </div>

      <div class="tab-panel" data-tab-panel="analysis" hidden>
        <div class="analysis-panel-row">
          <div class="toolbar-group">
            <span class="toolbar-label">Чей ход</span>
            <select id="side-to-move-select">
              <option value="white">Белые</option>
              <option value="black">Чёрные</option>
            </select>
          </div>
          <div class="toolbar-group">
            <label class="toggle-label">
              <input type="checkbox" id="stockfish-toggle" />
              Stockfish (анализ)
            </label>
          </div>
          <span class="analysis-note" id="stockfish-result"></span>
        </div>
      </div>
    </div>

    <div id="message-bar" class="message-bar" hidden></div>
  </div>

  <div id="confirm-overlay" class="confirm-overlay" hidden>
    <div class="confirm-dialog">
      <p id="confirm-text"></p>
      <div class="confirm-actions">
        <button id="confirm-cancel" type="button">Отмена</button>
        <button id="confirm-ok" class="danger-button" type="button">Подтвердить</button>
      </div>
    </div>
  </div>

  <script src="/board.js"></script>
</body>
</html>
